name: "Broken Link Checker"

on:
  issue_comment:
    types: [edited]

permissions:
  pull-requests: write
  checks: write

jobs:
  broken-link-checker:
    runs-on: ubuntu-latest
    if: github.actor == 'vercel[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: corepack enable
      - name: Get Vercel preview URL
        id: vercel_preview_url
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          url="$(printf '%s' "$COMMENT_BODY" | grep -oE 'https.*/.*-authjs\.vercel\.app' | head -n 1 | sed -E 's|.*/||')"
          echo "vercel_preview_url=$url" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: cd ./.github/broken-link-checker && pnpm install --ignore-workspace && pnpm build
      - name: Run link checker
        uses: ./.github/broken-link-checker
        id: broken-links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_PREVIEW_URL: https://${{ steps.vercel_preview_url.outputs.vercel_preview_url }}
